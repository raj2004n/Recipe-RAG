# Self-hosted workflow: build the serve image and push it to ghcr.
#
# The full payload the image needs (the sealed snapshot folder, the dataset it
# pins, the registry, and the staged model weights) lives only on this machine,
# so the job runs in the machine's checkout rather than a fresh workspace. It
# fires only after ci.yml has passed on a push to main, and bakes the snapshot
# the registry's serve target names into the image. The image is pushed as
# recipe-rag:<sha>, recipe-rag:latest, and recipe-rag:<serve folder>, so a
# deploy can pull whatever is promoted.

name: build

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main' }}
    runs-on: [self-hosted, gpu]
    env:
      REPO_PATH: /home/raj/projects/Recipe-RAG
      IMAGE: ghcr.io/raj2004n/recipe-rag
    steps:
      - name: Sync the machine checkout to the tested commit
        id: sync
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          cd "$REPO_PATH"
          git fetch origin
          git checkout --detach "$HEAD_SHA"
          echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stage the model weights
        run: |
          cd "$REPO_PATH"
          bash scripts/stage_weights.sh

      - name: Resolve the serve target
        id: serve
        run: |
          set -euo pipefail
          cd "$REPO_PATH"
          folder=$(python3 -c "import json; print(json.load(open('snapshots/registry.json'))['targets']['serve'])")
          if [ -z "$folder" ]; then
            echo "error: no serve target in the registry" >&2
            exit 1
          fi
          echo "folder=$folder" >> "$GITHUB_OUTPUT"

      - name: Build and tag the serve image
        run: |
          set -euo pipefail
          cd "$REPO_PATH"
          docker build \
            --build-arg "SNAPSHOT=${{ steps.serve.outputs.folder }}" \
            -t "$IMAGE:${{ steps.sync.outputs.sha }}" \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${{ steps.serve.outputs.folder }}" \
            .

      - name: Push to ghcr
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ steps.sync.outputs.sha }}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ steps.serve.outputs.folder }}"

      # The token used for the login above is the short-lived GITHUB_TOKEN,
      # which stops working when this workflow ends. Left behind in
      # ~/.docker/config.json, it makes later token-less pulls (the deploy
      # path) fail with "denied". Drop it before the job finishes.
      - name: Clear the build token credential
        run: docker logout ghcr.io
