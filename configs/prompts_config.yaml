# The prompt a served student answers from, and the ceiling on the turn it reads.
# A snapshot seals a copy of this file, so the service reads the sealed copy.

settings:
  # The ceiling on the recipes a user turn carries. It bounds the turn the prompt
  # renderer assembles: a recipe that would take the turn past it ends the list,
  # so what is carried is always a prefix of the ranked recipes.
  max_context_tokens: 4000

template:
  personas:
    # The fine-tuned student, served the prompt it was trained on. Only the system
    # line lives here. Its user turn is the recipes and the request assembled by
    # the renderer, so there is no user template to fill, and the value is quoted
    # rather than a block scalar because a trailing newline would change the
    # prompt the adapter was fitted on.
    student:
      generate:
        system: "You are a recipe developer who writes for home cooks."
