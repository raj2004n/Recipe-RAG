rag:
  strategy: hybrid

encoder:
  model_id: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 32
  normalize_embeddings: true

indexer:
  type: FlatIP
  dimension: 384 # for all-MiniLM-L6-v2
  
retriever:
  top_k: 10
  score_threshold: 0.5

hybrid:
  fusion:
    strategy: rrf          # rrf | weighted_sum
    rrf_k: 60
    weight_dense: 1.0
    weight_sparse: 1.0
  retrieval:
    top_k_dense: 50
    top_k_sparse: 50
  reranker:
    model_id: BAAI/bge-reranker-v2-m3
    max_length: 512
    top_n: 10
  prompt:
    final_top_k: 3         # recipes after dedupe-by-recipe-id

generator:
  model_id: google/gemma-3-1b-it
  max_input_tokens: 5000
  max_new_tokens: 2000
  truncation: true
  return_tensors: pt
  adapter_path: null

evaluation dataset generator:
  model_id: gemma3:4b
  request_timeout: 120
  max_retries: 4
  backoff_base: 2
  max_workers: 4

# Drafts the user-question prompts half of the eval-data golden subset. Eight
# rows per query type produce the 72-row hand-verified dataset. max_workers=2
# because the model is a cloud provider with a per-minute token cap.
prompts_drafter:
  model_id: minimax-m3:cloud
  max_retries: 3
  backoff_base: 2
  max_workers: 2
  per_type_count: 8

# Drafts reference answers for the verified prompts, once prompts have been
# approved in the review step.
answers_drafter:
  model_id: minimax-m3:cloud
  max_retries: 3
  backoff_base: 2
  max_workers: 2