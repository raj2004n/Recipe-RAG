rag:
  strategy: hybrid

encoder:
  model_id: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 32
  normalize_embeddings: true

indexer:
  type: FlatIP
  dimension: 384 # for all-MiniLM-L6-v2
  
retriever:
  top_k: 10
  score_threshold: 0.5

hybrid:
  fusion:
    strategy: rrf          # rrf | weighted_sum
    rrf_k: 60
    weight_dense: 1.0
    weight_sparse: 1.0
  retrieval:
    top_k_dense: 50
    top_k_sparse: 50
  reranker:
    model_id: BAAI/bge-reranker-v2-m3
    max_length: 512
    top_n: 10
  prompt:
    final_top_k: 2         # recipes after dedupe-by-recipe-id

generator:
  model_id: Qwen/Qwen3.5-0.8B
  max_input_tokens: 5000
  max_new_tokens: 2000
  truncation: true
  return_tensors: pt
  adapter_path: artifacts/student/qwen3.5-0.8b_lora_r16_20260919_1757/epoch_02

# Drafts the user-question prompts half of the eval-data golden subset. Eight
# rows per query type produce the 72-row hand-verified dataset. max_workers=2
# because the model is a cloud provider with a per-minute token cap.
prompts_drafter:
  model_id: minimax-m3:cloud
  max_retries: 3
  backoff_base: 2
  max_workers: 2
  per_type_count: 8

# Drafts reference answers for the verified prompts, once prompts have been
# approved in the review step.
answers_drafter:
  model_id: deepseek-v4-pro:cloud
  max_retries: 3
  backoff_base: 2
  max_workers: 2

# LLM-as-judge for the generation eval harness (scripts/evaluate_generation.py).
# The temperature is deliberately small but nonzero so the two judging calls
# per row sample independently and the disagreement rate measures real judge
# noise; a temperature of 0 would return identical scores and measure nothing.
# num_ctx must hold the query plus two whole recipes plus the generated
# answer, and for the expectedness persona the reference answer too.
# num_predict has to cover the judge's own reasoning tokens as well as the
# JSON: the probe run showed 800 truncating the JSON mid-string roughly three
# times out of four on minimax-m3:cloud, while 2000 completed every call.
generation_judge:
  model_id: minimax-m3:cloud
  temperature: 0.2
  num_ctx: 16384
  num_predict: 3000
  seed: 42        # passed through for reproducible reruns; provider may ignore it
  judge_calls: 2
  max_retries: 3
  backoff_base: 2