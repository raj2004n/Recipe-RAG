chunking:
  strategy: whole recipe

encoder:
  model: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 32
  normalize_embeddings: true

indexer:
  type: FlatIP
  dimension: 384 # for all-MiniLM-L6-v2
  
retriever:
  top_k: 10
  score_threshold: 0.5
  
generator:
  model_id: google/gemma-3-1b-it
  max_input_tokens: 5000
  max_new_tokens: 2000
  truncation: true
  return_tensors: pt
  adapter_path: null

evaluation dataset generator:
  model: gemma3:4b
  request_timeout: 120
  max_retries: 4
  backoff_base: 2
  max_workers: 4

paths:
  files:
    base_config: configs/base_config.yaml
    prompts_config: configs/prompts_config.yaml
    raw_recipes: data/raw/recipes.json
    cleaned_recipes: data/processed/cleaned_recipes.json
    evaluation_queries: data/evaluation/evaluation_queries.json
    
    chunks: snapshots/latest/chunks.json
    indexer: snapshots/latest/index.faiss
  
  directories:
    snapshots: snapshots
  