rag:
  strategy: hybrid

encoder:
  model_id: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 32
  normalize_embeddings: true

indexer:
  type: FlatIP
  dimension: 384 # for all-MiniLM-L6-v2
  
retriever:
  top_k: 10
  score_threshold: 0.5
  dense_sets:
    - dense
  sparse_sets:
    - sparse
  
generator:
  model_id: google/gemma-3-1b-it
  max_input_tokens: 5000
  max_new_tokens: 2000
  truncation: true
  return_tensors: pt
  adapter_path: null

evaluation dataset generator:
  model_id: gemma3:4b
  request_timeout: 120
  max_retries: 4
  backoff_base: 2
  max_workers: 4