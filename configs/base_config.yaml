embedding:
  model: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 32
  normalize_embeddings: true

chunking:
  strategy: whole recipe

index:
  type: FlatIP
  dimension: 384 # for all-MiniLM-L6-v2
  
retrieval:
  top_k: 10
  score_threshold: 0.5

prompts:
  system: Use the recipes to answer user query.
  max_context_tokens: 1500
  
generator:
  model_name: microsoft/phi-2
  max_new_tokens: 512
  max_input_length: 2048
  max_context_length: 15000
  epochs: 3
  adapter_path: null