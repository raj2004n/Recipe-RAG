stages:
  preprocess:
    cmd: python -m scripts.preprocess
    deps:
    - scripts/preprocess.py
    - data/raw/recipes.json
    outs:
    - data/processed/cleaned_recipes.json

  build_rag:
    cmd: python -m scripts.build_rag
    deps:
    - scripts/build_rag.py
    - data/processed/cleaned_recipes.json
    - configs/base_config.yaml
    - src/chunking/chunker.py
    - src/models/encoder.py
    - src/models/generator.py
    - src/models/indexer.py
    - src/models/retriever.py
    outs:
    - models/retriever
  


