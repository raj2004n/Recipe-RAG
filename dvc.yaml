stages:
  collect:
    cmd: python -m scripts.collect_data
    deps:
    - crawler/recipe_crawler/spiders/tineats_spider.py
    outs:
    - data/raw/recipes.jsonl

  preprocess:
    cmd: python -m scripts.preprocess
    deps:
    - scripts/preprocess.py
    - data/raw/recipes.jsonl
    outs:
    - data/processed/cleaned_recipes.json

  set_strategy:
    cmd: python -m scripts.build_rag --run set_strategy
    deps:
    - configs/base_config.yaml
    - configs/paths_config.yaml

  chunk:
    cmd: python -m scripts.build_rag --run chunk
    deps:
    - data/processed/cleaned_recipes.json
    - configs/base_config.yaml

  transform:
    cmd: python -m scripts.build_rag --run transform
    deps:
    - configs/base_config.yaml

  index:
    cmd: python -m scripts.build_rag --run index
    deps:
    - configs/base_config.yaml

  finalise_build:
    cmd: python -m scripts.build_rag --run finalise_build
    deps:
    - configs/base_config.yaml
    - configs/paths_config.yaml
    - configs/prompts_config.yaml
    - src/rag/core/snapshot/

  generate_eval_dataset:
    cmd: python -m scripts.generate_eval_dataset
    deps:
    - scripts/generate_eval_dataset.py
    - data/processed/cleaned_recipes.json
    outs:
    - data/evaluation/evaluation_dataset.json
    - data/evaluation/evaluation_queries.json
