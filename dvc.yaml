stages:
  collect:
    cmd: python -m scripts.collect_data
    deps:
    - crawler/recipe_crawler/spiders/tineats_spider.py
    outs:
    - data/raw/recipes.jsonl

  preprocess:
    cmd: python -m scripts.preprocess
    deps:
    - scripts/preprocess.py
    - data/raw/recipes.jsonl
    outs:
    - data/processed/cleaned_recipes.json

  set_strategy:
    cmd: python -m scripts.build_rag --run set_strategy
    deps:
    - scripts/build_rag.py
    - src/core/config.py
    - src/snapshot/
    - src/snapshot/datasets/
    - src/core/checksum.py
    params:
    - configs/base_config.yaml:
      - rag.strategy
    - configs/paths_config.yaml:
      - configs
      - data.cleaned_recipes
    outs:
    - build/staging/metadata.json

  chunk:
    cmd: python -m scripts.build_rag --run chunk
    deps:
    - scripts/build_rag.py
    - data/processed/cleaned_recipes.json
    - build/staging/metadata.json
    - src/build/
    - src/runtime/
    - src/domain/
    - src/corpus/preprocessor.py
    - src/core/
    - src/snapshot/
    params:
    - configs/paths_config.yaml:
      - configs
    outs:
    - build/staging/chunks/

  transform:
    cmd: python -m scripts.build_rag --run transform
    deps:
    - scripts/build_rag.py
    - build/staging/chunks/
    - src/build/
    - src/runtime/
    - src/domain/
    - src/core/
    - src/snapshot/
    params:
    - configs/base_config.yaml:
      - encoder.model_id
      - encoder.batch_size
      - encoder.normalize_embeddings
    - configs/paths_config.yaml:
      - configs
    outs:
    - build/staging/transformed_chunks/

  index:
    cmd: python -m scripts.build_rag --run index
    deps:
    - scripts/build_rag.py
    - build/staging/transformed_chunks/
    - src/build/
    - src/runtime/
    - src/domain/
    - src/core/
    - src/snapshot/
    params:
    - configs/base_config.yaml:
      - indexer.type
      - indexer.dimension
    - configs/paths_config.yaml:
      - configs
    outs:
    - build/staging/index/

  finalise_build:
    cmd: python -m scripts.build_rag --run finalise_build
    always_changed: true
    deps:
    - scripts/build_rag.py
    - build/staging/chunks/
    - build/staging/transformed_chunks/
    - build/staging/index/
    - configs/base_config.yaml
    - configs/paths_config.yaml
    - configs/prompts_config.yaml
    - src/build/
    - src/runtime/
    - src/domain/
    - src/core/
    - src/snapshot/
